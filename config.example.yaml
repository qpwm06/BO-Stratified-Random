# Example BO configuration. Copy and edit for your own campaign.
# All paths and cluster-specific entries are placeholders.

campaign_name: bo_stratified_demo

paths:
  # Sequence table: an Excel/CSV with columns ``label``, ``seq``, optional ``Rg``.
  sequence_table: ./templates/sequences.xlsx
  # Optional: a one-Rg-per-line text file overriding the ``Rg`` column.
  # Convention: file holds Rg in Angstroms; preprocess.py converts to nm.
  rg_targets: ""
  # Auto-generated by preprocess.py on first run if this path is empty
  # or missing. Holds the K AA-balanced anchor labels (the "fixed10").
  fixed10_table: ""
  # Directory holding one ``<label>/`` template per sequence in the
  # sequence table. Each template is copied into every candidate.
  template_run_root: ./templates
  # Output root for this campaign's candidates and BO state.
  runs_dir: ./runs
  # The interpreter (or wrapper script) that the SBATCH job invokes for
  # ``production.py``. Point at ``./scripts/fake_python.sh`` for a smoke
  # test, or at your engine's Python build for production.
  simulation_python: python

# Per-bead parameters that the BO sweeps. The names map back into the
# user-supplied template patcher (``optimization/patch_sim.py``).
amino_acids:
  - bead_00
  - bead_01
  - bead_02
  - bead_03
  - bead_04
  - bead_05
  - bead_06
  - bead_07
  - bead_08
  - bead_09
  - bead_10
  - bead_11
  - bead_12
  - bead_13
  - bead_14
  - bead_15
  - bead_16
  - bead_17
  - bead_18
  - bead_19

simulation:
  production_steps: 1000000
  pdump_log: 1000
  pdump_whole: 1000000
  pdump_nosol: 100000
  fresh_equilibration: true
  copy_restart_from_existing: true

objective:
  # Stratified-random subsampling: each candidate runs
  # ``fixed_per_candidate`` AA-balanced anchored sequences plus
  # ``random_per_candidate`` Rg-stratified random sequences.
  fixed_per_candidate: 10
  random_per_candidate: 10
  # Convex weights for the proxy loss. Must sum to 1 if you want the
  # proxy to be unbiased w.r.t. the full-pool MAE.
  fixed_weight: 0.5
  random_weight: 0.5
  # Optional Huber soft-cap per-sequence error in nm. 0 disables.
  huber_delta: 0.25
  burnin_ns: 5.0
  random_seed: 20260425

bo:
  # First ``n_initial_sobol`` candidates use Sobol space-filling for
  # exploration; subsequent candidates use Ax/BoTorch (qLogNEI).
  n_initial_sobol: 60
  sobol_seed: 20260425
  random_seed: 20260425
  batch_size: 4
  active_candidate_limit: 6
  early_stop_batch_window: 3
  early_stop_min_relative_improvement: 0.02
  max_trials: 200
  lower: 0.0
  upper: 1.0

slurm:
  submit: true
  # ``direct``: each sequence is its own ``sbatch`` submission.
  # ``resident``: each sequence is enqueued for the persistent worker pool.
  # ``local``: run synchronously in-process (only useful for the bundled
  # fake-runner smoke test; ignores the SBATCH bits below).
  launcher: resident
  partition: <PARTITION>
  gres: gpu:1
  time: "16:00:00"
  mem: 40GB
  nodes: 1
  ntasks_per_node: 8
  poll_seconds: 60
  retry_failed_jobs: 1
  mail_type: NONE
  module_block: []

resident_worker:
  enabled: true
  num_workers: 20
  partition: <PARTITION>
  gres: gpu:1
  time: "2-00:00:00"
  mem: 40GB
  nodes: 1
  ntasks_per_node: 8
  poll_seconds: 30
  stale_task_minutes: 20
  startup_watchdog_minutes: 5
  startup_watchdog_files:
    - thermo_md_log.txt
  stop_launch_within_hours: 5
  requeue_on_stop: true
  queue_dir: resident_queue
  module_block: []
